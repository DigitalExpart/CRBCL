name: CRBCL Mobile CI Workflow

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  mobile-ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Pub Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Run Flutter Static Analysis
        run: |
          cd mobile
          flutter analyze

      - name: Run Flutter Unit & Widget Tests
        run: |
          cd mobile
          flutter test -r expanded

      - name: Build Debug Android APK
        run: |
          cd mobile
          flutter build apk --debug

      - name: Build Release Android APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crbcl-mobile-android-apk
          path: |
            mobile/build/app/outputs/flutter-apk/app-release.apk
            mobile/build/app/outputs/flutter-apk/app-debug.apk

  mobile-ios-build:
    name: Build iOS App & IPA Artifact
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build iOS Application (Release, Unsigned)
        run: |
          cd mobile
          flutter build ios --no-codesign --release

      - name: Package Unsigned IPA for Sideloading & AltStore
        run: |
          cd mobile/build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r CRBCL_Field_Worker_iOS.ipa Payload
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: crbcl-mobile-ios-ipa
          path: |
            mobile/build/ios/iphoneos/CRBCL_Field_Worker_iOS.ipa
            mobile/build/ios/iphoneos/Runner.app.zip
