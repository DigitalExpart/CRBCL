name: CRBCL Platform CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  frontend:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_ENABLE_DEMO_DATA: false
          VITE_API_BASE_URL: http://localhost:8000

  backend:
    name: Backend (FastAPI / PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: crbcl
          POSTGRES_PASSWORD: crbcl_test_password
          POSTGRES_DB: crbcl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install backend dependencies
        run: |
          cd backend
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        run: |
          cd backend
          ruff check .

      - name: Validate Alembic Migrations
        env:
          DATABASE_SYNC_URL: postgresql://crbcl:crbcl_test_password@localhost:5432/crbcl_test
        run: |
          cd backend
          alembic upgrade head

      - name: Run Backend Tests
        env:
          APP_ENV: development
          DATABASE_URL: postgresql+asyncpg://crbcl:crbcl_test_password@localhost:5432/crbcl_test
          DATABASE_SYNC_URL: postgresql://crbcl:crbcl_test_password@localhost:5432/crbcl_test
          REDIS_URL: redis://localhost:6379/0
          SESSION_SECRET: test-session-secret-key-at-least-32-chars-long-here
        run: |
          cd backend
          pytest -v
