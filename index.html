<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CRBCL - Chief Red Bear Children's Lodge Digital Platform. Unified case management, program tracking, and organizational oversight." />
    <meta name="theme-color" content="#8B2B2B" />
    <script>
      (function() {
        try {
          var raw = localStorage.getItem('crbcl_theme_preferences');
          var prefs = raw ? JSON.parse(raw) : null;
          var root = document.documentElement;
          var themeMode = (prefs && prefs.theme_mode) ? prefs.theme_mode : 'system';
          var isDark = themeMode === 'dark' || (themeMode === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          if (isDark) {
            root.classList.add('dark');
          } else {
            root.classList.remove('dark');
          }

          var rawAccent = (prefs && prefs.accent_theme) ? prefs.accent_theme : 'crbcl';
          var accent = rawAccent.replace ? rawAccent.replace('_', '-') : rawAccent;
          var validAccents = [
            'crbcl', 'burgundy', 'earth', 'forest', 'prairie', 'ocean', 'teal', 'neutral',
            'pink', 'light-pink', 'purple', 'light-purple', 'sky-blue', 'yellow'
          ];
          validAccents.forEach(function(a) {
            root.classList.remove('theme-' + a);
            root.classList.remove('theme-' + a.replace('-', '_'));
          });
          if (validAccents.indexOf(accent) !== -1) {
            root.classList.add('theme-' + accent);
          } else {
            root.classList.add('theme-crbcl');
          }

          var density = (prefs && prefs.density) ? prefs.density : 'comfortable';
          if (density === 'compact') {
            root.classList.add('density-compact');
          } else {
            root.classList.remove('density-compact');
          }

          var radius = (prefs && prefs.card_radius) ? prefs.card_radius : 'rounded';
          root.classList.remove('radius-rounded', 'radius-subtle');
          root.classList.add('radius-' + (radius === 'subtle' ? 'subtle' : 'rounded'));

          if (prefs && prefs.high_contrast) {
            root.classList.add('high-contrast');
          } else {
            root.classList.remove('high-contrast');
          }

          if (prefs && prefs.reduced_motion) {
            root.classList.add('reduced-motion');
          } else {
            root.classList.remove('reduced-motion');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
